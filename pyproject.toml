[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensight"
version = "1.0.0"
description = "Automated incident response and forensics toolkit: collect, analyze, correlate, report."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "psutil>=5.9",
  "pyyaml>=6",
  "jinja2>=3.1",
  "pynacl>=1.5",
  "qrcode>=7.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
analysis = ["python-evtx>=0.8", "yara-python>=4.3"]
weasyprint = ["weasyprint>=60"]  # optional: FORENSIGHT_PDF_ENGINE=weasyprint (needs GTK/Pango)
ai = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6"]

[project.scripts]
forensight = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*", "collector*", "analyzer*", "api*", "demo*"]

[tool.setuptools.package-data]
api = ["fonts/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
