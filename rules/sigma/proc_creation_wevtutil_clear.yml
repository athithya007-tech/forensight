title: Event Log Cleared Via Wevtutil Or PowerShell
id: 9b2e7f44-1c0a-4d3b-8e6f-3a7b9c1d2e33
status: experimental
description: Clearing Windows event logs from the command line (ForenSight sample rule)
author: ForenSight
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  powershell:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
  condition: wevtutil or powershell
level: high
