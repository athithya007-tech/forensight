# Publishes the read-only online demo to GitHub Pages on every push to master.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Online demo (GitHub Pages)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install ForenSight
        run: pip install -e ".[analysis,dev]"
      - name: Tests
        run: pytest -q
      - name: Build the static dashboard
        working-directory: web
        run: |
          npm ci
          PAGES_BASE="/${{ github.event.repository.name }}/" npm run build:pages
      - name: Export demo cases (generated fresh, simulated data only)
        run: forensight export-site --out web/dist-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
